[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmap-cell-exemption-plugin"
version = "0.1.0"
description = "Napari plugin for CMAP existing-cell exemption labels and missing-cell box annotations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "CMAP Contributors" }]
keywords = ["napari", "cmap", "annotation", "cell-qc"]
classifiers = [
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "qtpy>=2.0",
  "tifffile>=2022.2.2",
]

[project.optional-dependencies]
bundled = [
  "napari[all]>=0.4.18",
  "npe2>=0.7.0",
]
dev = [
  "pytest>=7.0",
]

[project.entry-points."napari.manifest"]
cmap-cell-exemption-plugin = "cmap_cell_exemption_plugin:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/cmap_cell_exemption_plugin"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/run_exemption.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
